name: Streamlit Keep Alive

on:
  schedule:
    # Esegue l'azione ogni 3 giorni (puoi modificarlo secondo le tue esigenze, es. '0 */12 * * *' per ogni 12 ore)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Consente di avviare il workflow manualmente dalla tab Actions di GitHub

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium

      - name: Run keep-alive script
        run: python keep_alive.py
