name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # Aggiornato da v3 a v4

      - name: Set up Python
        uses: actions/setup-python@v5  # Aggiornato da v4 a v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium

      - name: Run keep-alive script
        run: python keep_alive.py
